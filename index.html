<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Йетя</title>
  <meta name="description" content="Йетя — простой мессенджер">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a18" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Йетя">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Экран: не настроено -->
  <section id="setup" class="screen center hidden">
    <div class="card">
      <img src="icons/icon-192.png" alt="" class="logo">
      <h1>Почти готово</h1>
      <p>Открой файл <code>config.js</code> и вставь адрес и anon-ключ своего проекта Supabase. Подробно — в README.md.</p>
    </div>
  </section>

  <!-- Экран: вход / регистрация -->
  <section id="auth" class="screen center hidden">
    <div class="card">
      <img src="icons/icon-192.png" alt="" class="logo">
      <h1>Йетя</h1>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" type="button">Вход</button>
        <button class="tab" data-tab="register" type="button">Регистрация</button>
      </div>

      <form id="login-form" class="form">
        <input name="email" type="email" placeholder="Почта" autocomplete="email" inputmode="email" required>
        <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required minlength="6">
        <button class="btn primary" type="submit">Войти</button>
      </form>

      <form id="register-form" class="form hidden">
        <input name="name" type="text" placeholder="Имя" autocomplete="name" maxlength="60" required>
        <input name="username" type="text" placeholder="ID (латиница, цифры, _)" autocomplete="username"
               pattern="[a-zA-Z0-9_]{3,24}" maxlength="24" required autocapitalize="none" autocorrect="off" spellcheck="false">
        <input name="email" type="email" placeholder="Почта" autocomplete="email" inputmode="email" required>
        <input name="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="new-password" required minlength="6">
        <button class="btn primary" type="submit">Создать аккаунт</button>
      </form>

      <p id="auth-msg" class="msg" role="status"></p>
    </div>
  </section>

  <!-- Основной экран -->
  <section id="app" class="screen hidden">
    <aside id="sidebar" class="pane">
      <header class="bar">
        <button id="me-btn" class="avatar-btn" type="button" aria-label="Профиль"></button>
        <div class="bar-title">Чаты <span id="conn" class="conn" title="Соединение"></span></div>
        <button id="compose-btn" class="icon-btn always" type="button" aria-label="Новый чат">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </header>
      <div class="search">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Поиск по ID или имени" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </div>
      <div id="search-results" class="list hidden"></div>
      <div id="chat-list" class="list"></div>
    </aside>

    <main id="chat" class="pane">
      <div id="chat-placeholder" class="empty">
        <img src="icons/icon-192.png" alt="" class="logo big">
        <p>Выбери чат слева</p>
      </div>
      <div id="chat-view" class="hidden">
        <header class="bar">
          <button id="back-btn" class="icon-btn back" type="button" aria-label="Назад">
            <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="back-badge" class="back-badge hidden"></span>
          </button>
          <div id="peer-avatar"></div>
          <div class="peer">
            <div id="peer-name" class="peer-name"></div>
            <div id="peer-status" class="peer-status"></div>
          </div>
          <button id="call-video-btn" class="icon-btn always call-btn" type="button" aria-label="Видеозвонок">
            <svg viewBox="0 0 24 24" width="25" height="25"><rect x="2.5" y="6" width="13" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 10.5l5-3v9l-5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button id="call-audio-btn" class="icon-btn always call-btn" type="button" aria-label="Позвонить">
            <svg viewBox="0 0 24 24" width="23" height="23"><path d="M5 3.5h3.2l1.6 4.3-2.2 1.4a11.5 11.5 0 006.2 6.2l1.4-2.2 4.3 1.6V18a2.5 2.5 0 01-2.5 2.5A16.5 16.5 0 012.5 6 2.5 2.5 0 015 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </header>
        <div class="messages-wrap">
          <div id="messages" class="messages"></div>
          <button id="down-btn" class="down-btn hidden" type="button" aria-label="Вниз">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <form id="composer" class="composer">
          <button id="attach-btn" class="cbtn" type="button" aria-label="Прикрепить фото">
            <svg viewBox="0 0 24 24" width="25" height="25"><path d="M20 11.5l-7.8 7.8a5 5 0 01-7.1-7.1l8.1-8.1a3.3 3.3 0 014.7 4.7l-8 8a1.7 1.7 0 01-2.4-2.4l7.4-7.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="file-input" type="file" accept="image/*" multiple hidden>
          <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4000" enterkeyhint="send"></textarea>
          <button id="mic-btn" class="send mic" type="button" aria-label="Записать голосовое">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="send-btn" class="send hidden" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a1 1 0 00-1.4 1.1L4 11l9 1-9 1-2 6.3a1 1 0 001.4 1.1z" fill="currentColor"/></svg>
          </button>
        </form>
        <div id="recorder" class="composer recorder hidden">
          <button id="rec-cancel" class="cbtn danger" type="button" aria-label="Удалить запись">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <span class="rec-dot"></span>
          <span id="rec-time" class="rec-time">0:00</span>
          <canvas id="rec-level" class="rec-level" width="300" height="40"></canvas>
          <button id="rec-send" class="send" type="button" aria-label="Отправить голосовое">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a1 1 0 00-1.4 1.1L4 11l9 1-9 1-2 6.3a1 1 0 001.4 1.1z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </main>
  </section>

  <!-- Меню действий с сообщением -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div id="sheet-preview" class="sheet-preview"></div>
      <div id="sheet-actions" class="sheet-actions"></div>
      <button class="sheet-cancel" type="button">Отмена</button>
    </div>
  </div>

  <!-- Профиль -->
  <dialog id="profile-dlg">
    <form id="profile-form" method="dialog" class="form">
      <div class="grabber"></div>
      <h2>Профиль</h2>
      <label class="avatar-edit">
        <span id="profile-avatar"></span>
        <input id="avatar-input" type="file" accept="image/*" hidden>
        <span class="link">Сменить фото</span>
      </label>
      <label>Имя<input name="name" type="text" maxlength="60"></label>
      <label>ID<input name="username" type="text" pattern="[a-zA-Z0-9_]{3,24}" maxlength="24" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <p class="hint" id="profile-email"></p>
      <button id="notify-btn" class="btn" type="button">Включить уведомления</button>
      <p class="hint" id="install-hint"></p>
      <p id="profile-msg" class="msg" role="status"></p>
      <div class="row">
        <button id="logout-btn" class="btn danger" type="button">Выйти</button>
        <span class="spacer"></span>
        <button value="cancel" class="btn" type="submit" formnovalidate>Закрыть</button>
        <button id="profile-save" class="btn primary" type="button">Сохранить</button>
      </div>
    </form>
  </dialog>

  <!-- Просмотр фото -->
  <div id="viewer" class="viewer hidden">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <a id="viewer-open" class="viewer-btn" target="_blank" rel="noopener">Открыть оригинал</a>
      <button id="viewer-close" class="viewer-btn" type="button">Закрыть</button>
    </div>
  </div>

  <!-- Звонок -->
  <div id="call" class="call hidden">
    <video id="remote-video" class="remote-video hidden" autoplay playsinline></video>
    <video id="local-video" class="local-video hidden" autoplay playsinline muted></video>
    <audio id="remote-audio" autoplay></audio>
    <div class="call-info">
      <div id="call-avatar"></div>
      <div id="call-name" class="call-name"></div>
      <div id="call-status" class="call-status"></div>
    </div>
    <div id="call-actions" class="call-actions"></div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
  <script src="app.js"></script>
</body>
</html>
